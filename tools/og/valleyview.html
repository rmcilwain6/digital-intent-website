<!doctype html>
<!--
  Sharing image for the Valleyview page and recipient stories
  (public/brand/og-valleyview.png). Headline design, approved by Reed,
  November 26, 2026. Copy from content/valleyview.ts; no dates, so it
  doesn't go stale between application windows.
-->
<meta charset="utf-8" />
<link rel="stylesheet" href="og.css" />
<style>
  body {
    padding: 56px 72px;
  }

  .path {
    color: var(--color-red);
    font-size: 22px;
  }

  .name {
    margin-top: 10px;
    font-size: 30px;
    font-weight: var(--font-weight-bold);
  }

  h1 {
    max-width: 11em;
    margin-top: 28px;
    font-size: 96px;
    line-height: 1;
  }

  h1 mark {
    margin: 0 -6px;
    padding: 0 6px;
    background: linear-gradient(
      to bottom,
      transparent 14%,
      var(--color-lime) 14%,
      var(--color-lime) 94%,
      transparent 94%
    );
    color: inherit;
  }

  .facts {
    position: absolute;
    right: 72px;
    bottom: 52px;
    left: 72px;
    display: flex;
    gap: 22px;
    padding-top: 22px;
    border-top: 2px solid var(--color-border);
    font-size: 24px;
    font-weight: var(--font-weight-bold);
  }

  .facts span + span::before {
    content: '•';
    margin-right: 22px;
    color: var(--color-red);
  }

  .logo {
    position: absolute;
    top: 40px;
    right: 60px;
    height: 60px;
  }
</style>
<img class="logo" src="../../public/brand/logo.svg" alt="" />
<p class="path mono">/valleyview</p>
<p class="name">Valleyview Social Innovation Grant</p>
<h1>Pick a hard problem. We'll put <mark>$2,000</mark> behind it.</h1>
<p class="facts">
  <span>$2,000 plus mentorship</span><span>For Valleyview Grade 12s</span
  ><span>A rough idea is enough</span>
</p>
